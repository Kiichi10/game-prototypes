<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Unity 試作</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #000; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-family: sans-serif; gap: 14px; }
  #bar { width: 60vw; max-width: 320px; height: 10px; border: 2px solid #fff; }
  #fill { width: 0; height: 100%; background: #fff; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><div>よみこみ中…（初回は少し時間がかかります）</div><div id="bar"><div id="fill"></div></div></div>
<script src="Build/WebGL.loader.js"></script>
<script>
  var canvas = document.querySelector("#unity-canvas");
  createUnityInstance(canvas, {
    dataUrl: "Build/WebGL.data.unityweb",
    frameworkUrl: "Build/WebGL.framework.js.unityweb",
    codeUrl: "Build/WebGL.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "omoide",
    productName: "RetroDemo",
    productVersion: "1.0",
    matchWebGLToCanvasSize: true,
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
  }, function (p) { document.querySelector("#fill").style.width = (p * 100) + "%"; })
  .then(function (inst) { window.unityInstance = inst; document.querySelector("#loading").style.display = "none"; canvas.focus(); })
  .catch(function (e) { document.querySelector("#loading").textContent = "読み込みに失敗しました: " + e; });
</script>
</body>
</html>
