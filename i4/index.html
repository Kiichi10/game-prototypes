<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex"><title>アイテムボックス一本道</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}[hidden]{display:none!important}
body{margin:0;background:#1d2b1a;color:#fff;font-family:"DotGothic16","Hiragino Sans",sans-serif;overscroll-behavior:none;touch-action:none}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
#cv{flex:1;width:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none}
.slot{width:74px;height:74px;border-radius:14px;background:rgba(0,0,0,.55);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:40px}
.slot2{width:44px;height:44px;border-radius:10px;background:rgba(0,0,0,.5);border:2px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:24px;margin-top:6px}
.lefthud{display:flex;flex-direction:column;align-items:flex-start}.coins{font-size:15px;margin-top:6px;text-shadow:0 2px 0 #000}
.course{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:14px;text-shadow:0 2px 0 #000;pointer-events:none}
.slot.spin{border-color:#ffd84a;animation:pulse .2s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.pos{font-size:44px;line-height:1;text-shadow:0 3px 0 #000,0 0 8px #000}.pos small{font-size:18px}
.prog{position:absolute;right:10px;top:70px;bottom:150px;width:8px;background:rgba(0,0,0,.4);border-radius:4px;pointer-events:none}
.prog i{position:absolute;left:-4px;width:16px;height:16px;border-radius:50%;border:2px solid #000}
.ctrl{display:flex;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#14200f}
.ctrl button{font-family:inherit;font-size:20px;border:0;border-radius:14px;padding:14px 0;color:#fff;background:#2e4426}
.ctrl .l,.ctrl .r{flex:1}.ctrl .use{flex:1.6;background:#d8402c;font-size:19px}
.ctrl .use[disabled]{background:#3a3a3a;color:#888}
.sheet{position:absolute;inset:0;background:rgba(10,16,8,.93);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:22px;z-index:5;overflow:auto}
.sheet h2{margin:0;text-align:center;font-size:30px;color:#ffd84a}
.sheet p{margin:0;text-align:center;line-height:1.7}
.btn{font-family:inherit;font-size:19px;padding:14px;border:0;border-radius:14px;background:#ffd84a;color:#2a2000}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.it{background:#22331d;border-radius:12px;padding:8px 2px;text-align:center;font-size:26px}.it small{display:block;font-size:10px;color:#cfe0c4}
.it.lock{opacity:.35}.it.new{outline:3px solid #ffd84a;animation:pop .5s both}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.btn.sub{background:transparent;color:#fff;border:2px solid #5a7a4a;font-size:16px}
.tb{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:15px}.tb td{padding:5px 4px;border-bottom:1px solid #2e4426;text-align:left}.tb tr.me{color:#ffd84a}
.tb i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.unl{margin-top:10px;border:2px solid #ffd84a;border-radius:10px;padding:8px;color:#ffd84a;font-size:17px;animation:pop .5s both}.unl small{color:#cfe0c4;font-size:12px}
.gp{font-family:inherit;text-align:left;padding:10px 12px;border:2px solid #3a5a30;border-radius:10px;background:#22331d;color:#e8f0e0;font-size:13px}
.gp b{display:block;font-size:16px;color:#fff}.gp b span{float:right;color:#ffd84a}.gp[disabled]{opacity:.45}
.gcs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.gc{font-family:inherit;font-size:11px;color:#fff;background:#22331d;border:2px solid #3a5a30;border-radius:8px;padding:6px 2px}
.gc i{display:block;width:26px;height:18px;margin:0 auto 3px;border-radius:5px;border:1px solid #000}.gc.on{border-color:#ffd84a}.gc[disabled]{opacity:.4}
.bgm{position:absolute;right:10px;top:118px;z-index:3;background:rgba(0,0,0,.4);border:0;border-radius:8px;font-size:16px;padding:4px 6px}
.rec{font-size:14px;color:#cfe0c4}.rec b{color:#ffd84a}
.cls{display:flex;gap:6px}.clb{flex:1;font-family:inherit;font-size:16px;padding:10px 0;border-radius:12px;border:2px solid #3a5a30;background:#22331d;color:#fff}
.clb.on{border-color:#ffd84a;background:#3a4a1a}.clb[disabled]{opacity:.4}.clb small{display:block;font-size:12px;min-height:14px}
.tip{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#fff3c8;color:#2a2000;border-radius:12px;padding:10px 14px;font-size:15px;z-index:4;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.4);animation:tipin 2.6s both;pointer-events:none}
@keyframes tipin{0%{opacity:0;transform:translate(-50%,20px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:30px;text-shadow:0 3px 0 #000;pointer-events:none;z-index:4;white-space:nowrap;animation:toast .9s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0}}
.px{image-rendering:pixelated;display:block}.px.in{display:inline-block;vertical-align:-3px;margin:0 1px}
.slot,.slot2,.btn,.ctrl button,.it,.gp,.gc,.clb,.tip,.unl,.bgm{border-radius:2px}
.slot .px{width:auto;height:48px}.slot2 .px{width:auto;height:28px}.it .px{margin:0 auto 2px;width:auto;height:26px;display:block}
.ctrl button{display:flex;align-items:center;justify-content:center}.ctrl .l .px,.ctrl .r .px{height:24px;width:auto}
#cv{image-rendering:auto}
.carpv{display:block;margin:0 auto;width:120px;height:144px;image-rendering:pixelated;background:#5a5a62;border:2px solid #000}
.sb{display:flex;align-items:center;gap:8px;font-size:12px;margin:2px 0}.sb span{width:52px;color:#cfe0c4}.sb i{flex:1;height:10px;background:#14200f;display:block}.sb b{display:block;height:100%;background:#ffd84a}
.sl{font-size:14px;color:#cfe0c4;text-align:left!important;margin:10px 0 4px!important}.cps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cp{font-family:inherit;text-align:left;padding:7px 8px;border:2px solid #3a5a30;border-radius:2px;background:#22331d;color:#fff;font-size:14px}.cp b{display:block;font-weight:400}.cp b span{float:right;color:#ffd84a;font-size:12px}.cp small{display:block;font-size:10px;line-height:1.35;color:#cfe0c4}.cp.on{border-color:#ffd84a;background:#3a4a1a}.cp[disabled]{opacity:.45}
#garage,#cardSheet{background:#0c1409}
#cups .clb{font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px}
.sheet{justify-content:flex-start!important}.sheet>:first-child{margin-top:auto}.sheet>:last-child{margin-bottom:auto}
.sheet{touch-action:pan-y}@media(max-height:720px){#title>p:first-of-type{font-size:12px;line-height:1.45}#title h2{font-size:24px}#title{gap:8px}#title .btn{padding:10px}}
</style></head><body>
<div class="app" id="app">
  <canvas id="cv"></canvas>
  <div class="course" id="course"></div><button id="bgmBtn" class="bgm">🔊</button>
  <div class="hud"><div class="lefthud"><div class="slot" id="slot"></div><div class="slot2" id="slot2"></div><div class="coins">🪙 <span id="coins">0</span></div></div><div class="pos" id="pos">4<small>位</small></div></div>
  <div class="prog" id="prog"></div>
  <div class="ctrl"><button class="l" id="bl">◀</button><button class="use" id="use" disabled>つかう</button><button class="r" id="br">▶</button></div>

  <div class="sheet" id="title">
    <h2>アイテムボックス一本道</h2>
    <p>車は勝手に走る。<b style="color:#ffd84a">くじ玉</b>に当たるとアイテムが出る。<br>いいところで「つかう」。<br>◀ ▶（または画面の左右）で車線を変える。<br><span style="font-size:13px;color:#cfe0c4">4コースのグランプリ。ライバルもアイテムを使ってくる<br>真後ろに付くとスリップストリーム</span></p>
    <div class="cls" id="cups"></div>
    <div class="cls" id="cls"></div>
    <button class="btn" id="start">グランプリ スタート</button>
    <button class="btn sub" id="taBtn">タイムアタック（自分の影と競う）</button>
    <button class="btn sub" id="gBtn">ガレージ</button>
    <p id="tinfo" style="font-size:14px"></p>
    <p style="font-size:12px;color:#9ab08a">1レース約30秒（試作 v6・音が出ます）</p>
  </div>
  <div class="sheet" id="endSheet" hidden>
    <h2 id="endT"></h2><p id="endRec" class="rec"></p><p id="endP"></p>
    <button class="btn" id="again">次のレースへ</button>
    <button class="btn sub" id="endGar">ガレージ（部品を付け替える）</button>
    <button class="btn sub" id="endTitle" hidden>タイトルへ</button>
  </div>
  <div class="sheet" id="cupSheet" hidden>
    <h2 id="cupT"></h2><div id="cupOpen"></div><p id="cupP"></p>
    <button class="btn" id="cupAgain">もう一度（クラスを選ぶ）</button>
    <button class="btn sub" id="cupGarage">ガレージ</button>
    <button class="btn sub" id="cupShare">結果をコピー</button>
  </div>
  <div class="sheet" id="taSheet" hidden style="justify-content:flex-start;background:#0c1409"><h2>タイムアタック</h2><p style="font-size:13px">ライバルもくじ玉もなし。自己ベストの影と競う</p><div id="taList" style="display:flex;flex-direction:column;gap:6px"></div><button class="btn" id="taClose">もどる</button></div>
  <div class="sheet" id="cardSheet" hidden style="justify-content:flex-start;z-index:6"><img id="cardImg" alt="車検証" style="width:100%"><p style="font-size:13px">画像を長押しで保存できます</p><button class="btn" id="cardDl">画像を保存</button><button class="btn sub" id="cardClose">もどる</button></div>
  <div class="sheet" id="garage" hidden style="justify-content:flex-start">
    <h2>🔧 ガレージ</h2><p>🪙 <b id="gcoins" style="color:#ffd84a;font-size:22px"></b></p>
    <canvas id="carPv" class="carpv" width="160" height="192"></canvas>
    <p id="carName" style="font-size:20px;color:#ffd84a"></p><div id="carBars"></div>
    <button class="btn sub" id="cardBtn">車検証を作る（画像）</button>
    <div id="carParts"></div>
    <p class="sl">チューニング（ずっと効く）</p><div id="glist" style="display:flex;flex-direction:column;gap:8px"></div>
    <p style="font-size:13px;margin-top:6px">車の色</p><div class="gcs" id="gcolors"></div>
    <p style="font-size:13px;margin-top:6px">集めたアイテム</p><div class="items" id="gitems"></div>
    <button class="btn" id="gClose">もどる</button>
  </div>
</div>
<script src="sprites.js"></script>
<script src="data.js"></script>
<script src="fx.js"></script>
<script src="car.js"></script>
<script src="game.js"></script>
</body></html>
