<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex"><title>アイテムボックス一本道（30秒の核）</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}[hidden]{display:none!important}
body{margin:0;background:#1d2b1a;color:#fff;font-family:"M PLUS Rounded 1c","Hiragino Sans",sans-serif;overscroll-behavior:none;touch-action:none}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
#cv{flex:1;width:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;pointer-events:none}
.slot{width:74px;height:74px;border-radius:14px;background:rgba(0,0,0,.55);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:40px}
.slot.spin{border-color:#ffd84a;animation:pulse .2s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.pos{font-size:44px;line-height:1;text-shadow:0 3px 0 #000,0 0 8px #000}.pos small{font-size:18px}
.prog{position:absolute;right:10px;top:70px;bottom:150px;width:8px;background:rgba(0,0,0,.4);border-radius:4px;pointer-events:none}
.prog i{position:absolute;left:-4px;width:16px;height:16px;border-radius:50%;border:2px solid #000}
.ctrl{display:flex;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#14200f}
.ctrl button{font-family:inherit;font-size:20px;border:0;border-radius:14px;padding:14px 0;color:#fff;background:#2e4426}
.ctrl .l,.ctrl .r{flex:1}.ctrl .use{flex:1.6;background:#d8402c;font-size:19px}
.ctrl .use[disabled]{background:#3a3a3a;color:#888}
.sheet{position:absolute;inset:0;background:rgba(10,16,8,.93);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:22px;z-index:5;overflow:auto}
.sheet h2{margin:0;text-align:center;font-size:30px;color:#ffd84a}
.sheet p{margin:0;text-align:center;line-height:1.7}
.btn{font-family:inherit;font-size:19px;padding:14px;border:0;border-radius:14px;background:#ffd84a;color:#2a2000}
.items{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.it{background:#22331d;border-radius:12px;padding:8px 2px;text-align:center;font-size:26px}.it small{display:block;font-size:10px;color:#cfe0c4}
.it.lock{opacity:.35}.it.new{outline:3px solid #ffd84a;animation:pop .5s both}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:30px;text-shadow:0 3px 0 #000;pointer-events:none;z-index:4;white-space:nowrap;animation:toast .9s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0}}
</style></head><body>
<div class="app" id="app">
  <canvas id="cv"></canvas>
  <div class="hud"><div class="slot" id="slot"></div><div class="pos" id="pos">4<small>位</small></div></div>
  <div class="prog" id="prog"></div>
  <div class="ctrl"><button class="l" id="bl">◀</button><button class="use" id="use" disabled>つかう</button><button class="r" id="br">▶</button></div>

  <div class="sheet" id="title">
    <h2>アイテムボックス一本道</h2>
    <p>車は勝手に走る。<b style="color:#ffd84a">？の箱</b>に当たるとアイテムが出る。<br>いいところで「つかう」。<br>◀ ▶（または画面の左右）で車線を変える。</p>
    <button class="btn" id="start">スタート</button>
    <p style="font-size:12px;color:#9ab08a">1レース約30秒の試作（音が出ます）</p>
  </div>
  <div class="sheet" id="endSheet" hidden>
    <h2 id="endT"></h2><p id="endP"></p>
    <div class="items" id="items"></div>
    <button class="btn" id="again">次のレースへ</button>
  </div>
</div>
<script src="game.js"></script>
</body></html>
