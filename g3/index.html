<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex"><title>1分バトル（おもちゃ版）</title>
<style>
:root{--bg:#191a22;--panel:#23252f;--ink:#f3eee3;--sub:#9ea0ae;--line:#33364a;--gold:#f6c453}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior:none;touch-action:none}
.app{max-width:460px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative}
.hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 4px;font-size:13px;color:var(--sub)}.hud b{color:var(--ink);font-size:20px}
.xp{height:6px;background:#11121a;margin:0 14px 6px;border-radius:4px;overflow:hidden}.xp i{display:block;height:100%;background:#5aa9ff}
canvas{flex:1;width:100%;display:block;background:radial-gradient(circle at 50% 50%,#22242f,#14151c)}
.skills{display:flex;gap:5px;flex-wrap:wrap;padding:6px 14px calc(10px + env(safe-area-inset-bottom));min-height:38px}
.sk{font-size:11px;background:#2a2c38;border-radius:8px;padding:3px 7px}.sk.d{background:#3a3220;color:var(--gold)}
.sheet{position:absolute;inset:0;background:rgba(14,15,21,.93);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:20px;z-index:5;overflow:auto}
.sheet h2{margin:0;font-family:"Hiragino Mincho ProN",serif;font-size:28px;text-align:center}
.sheet p{color:var(--sub);text-align:center;margin:0 0 6px;line-height:1.7}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--ink);font-family:inherit;font-size:14px;animation:pop .35s both}
.card b{display:block;font-size:18px;margin-bottom:2px}.card small{color:var(--sub)}.card .lv{float:right;color:var(--sub);font-size:12px}
.card.d{border-color:#c99a2e;background:linear-gradient(160deg,#3a3220,#23252f)}.card.d b{color:var(--gold)}.card .date{font-size:11px;color:var(--gold);letter-spacing:.05em}
.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.16s}.card:nth-child(5){animation-delay:.24s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.btn{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;background:var(--gold);color:#2a2010;font-family:inherit;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
input[type=text]{width:100%;padding:13px;border-radius:12px;border:0;font-size:16px;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:7px 12px;font-size:14px;font-family:inherit}.chip.on{background:var(--ink);color:var(--bg)}
.list{font-size:13px;color:var(--sub);text-align:center;line-height:1.8}
</style></head><body>
<div class="app">
  <div class="hud"><span>Lv <b id="lv">1</b></span><span>のこり <b id="time">60</b> 秒</span><span>倒した <b id="kills">0</b></span></div>
  <div class="xp"><i id="xpb" style="width:0"></i></div>
  <canvas id="cv"></canvas>
  <div class="skills" id="skills"></div>
</div>
<script src="game.js"></script>
</body></html>
