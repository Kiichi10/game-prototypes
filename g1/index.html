<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>言葉の合成（おもちゃ版）</title>
<style>
:root{--bg:#191a22;--panel:#23252f;--ink:#f3eee3;--sub:#9ea0ae;--line:#33364a;--gold:#f6c453}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior:none}
.app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.top b{color:var(--gold);font-size:18px}
.bar{height:6px;background:#11121a;border-radius:4px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.pot{background:var(--panel);border-radius:20px;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:120px;position:relative}
.slot{width:96px;height:84px;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;text-align:center;font-size:13px;color:var(--sub)}
.slot.f{border-style:solid;border-color:var(--gold);color:var(--ink)}.slot .e{font-size:30px;display:block}
.plus{font-size:24px;color:var(--sub)}
.msg{text-align:center;min-height:22px;font-size:13px;color:var(--sub);margin:8px 0}
.msg b{color:var(--gold)}
.grid{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;flex:1;overflow:auto;padding:4px 0}
.chip{border:1.5px solid var(--line);background:#20222c;color:var(--ink);border-radius:12px;padding:7px 10px;font-size:15px;font-family:inherit;display:flex;gap:5px;align-items:center}
.chip.sel{border-color:var(--gold);background:#3a3220}.chip.rare{border-color:#c99a2e;color:var(--gold)}.chip.new{animation:pop .5s}
.chip.lock{opacity:.45;border-style:dashed}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.btn{border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:800;background:var(--gold);color:#2a2010;font-family:inherit;width:100%;margin-top:10px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.reveal{position:fixed;inset:0;background:rgba(14,15,21,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;gap:6px;padding:24px;text-align:center}
.reveal .e{font-size:96px;animation:pop .6s}.reveal h2{font-family:"Hiragino Mincho ProN",serif;font-size:32px;margin:6px 0}
.reveal .lab{font-weight:900;letter-spacing:.2em;color:var(--gold)}.reveal p{color:var(--sub);margin:4px 0 18px;line-height:1.7}
.reveal.rare .e{filter:drop-shadow(0 0 22px #f6c453)}.reveal.rare h2{color:var(--gold)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
textarea{width:100%;height:90px;border-radius:12px;border:0;padding:12px;font-size:16px;font-family:inherit}
h3{margin:14px 0 4px;font-size:13px;color:var(--sub);font-weight:600}
</style></head><body>
<div class="app">
  <div class="top"><span>言葉の合成 · おもちゃ版</span><span>発見 <b id="cnt"></b></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="pot" id="pot"><div class="slot" id="s0">ひとつ目</div><span class="plus">＋</span><div class="slot" id="s1">ふたつ目</div></div>
  <div class="msg" id="msg">素材を2つ選ぶと、くっつきます</div>
  <h3>持っている素材</h3>
  <div class="grid" id="grid"></div>
  <h3>日記に書くと手に入る素材</h3>
  <div class="grid" id="locked" style="flex:none"></div>
  <button class="btn" id="write">今日の日記を書く（素材が増える）</button>
  <button class="btn ghost" id="reset" style="font-size:12px;padding:8px">最初からやり直す</button>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body></html>
