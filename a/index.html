<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あなたの感覚は、何年生まれ？</title>
<style>
:root{--bg:#f6f1e7;--ink:#1f1b16;--sub:#7a7167;--line:#e2d9c8;--red:#d9452b;--card:#fffdf8}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
.screen{min-height:100vh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:28px 22px 40px}
.mincho{font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.tag{display:inline-block;border:1.5px solid var(--ink);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700;letter-spacing:.06em}
h1{font-size:46px;line-height:1.25;margin:26px 0 14px;font-weight:600}
h1 .r{color:var(--red)}
.lead{color:#4a443d;font-size:16px;line-height:1.8}
.strip{display:flex;gap:6px;margin:28px 0;overflow:hidden}
.strip span{flex:1;text-align:center;font-size:13px;padding:10px 0;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--sub)}
.cta{margin-top:auto;background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:18px;font-size:19px;font-weight:700;cursor:pointer;width:100%}
.cta.red{background:var(--red);color:#fff}
.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer}
.dots{display:flex;gap:5px;margin-bottom:26px}.dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}.dots i.on{background:var(--ink)}
.qn{color:var(--red);font-weight:800;font-size:14px;letter-spacing:.08em}
.qt{font-size:27px;line-height:1.5;margin:10px 0 26px;font-weight:600}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:17px 18px;margin:0 0 12px;font-size:17px;color:var(--ink);cursor:pointer;transition:transform .08s,border-color .15s}
.opt:active{transform:scale(.98)}.opt.pick{border-color:var(--ink);background:#fff}
.slide{animation:slide .35s ease}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.calc{margin:auto;text-align:center}.calc .y{font-size:92px;font-weight:600}.calc p{color:var(--sub)}
.res-top{text-align:center;margin-top:10px}
.res-top .pre{color:var(--sub);font-size:15px}
.big{font-size:84px;line-height:1.05;font-weight:600;margin:8px 0 0}.big small{font-size:26px;margin-left:4px}
.wa{color:var(--sub);font-size:16px;margin-top:4px}
.type{display:inline-block;margin-top:16px;background:var(--red);color:#fff;font-weight:800;padding:6px 16px;border-radius:99px;font-size:17px}
.desc{font-size:16px;line-height:1.85;margin:16px 0 4px;text-align:left}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:18px 0}
.box h3{margin:0 0 10px;font-size:15px}
.bar{position:relative;height:38px;margin:8px 0 2px}
.bar .axis{position:absolute;left:0;right:0;top:18px;height:2px;background:var(--line)}
.bar .pt{position:absolute;top:12px;width:14px;height:14px;border-radius:50%;background:var(--ink);transform:translateX(-50%);opacity:.25}
.bar .me{position:absolute;top:6px;width:4px;height:26px;background:var(--red);transform:translateX(-50%);border-radius:2px}
.bar .real{position:absolute;top:4px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #2b6cb0;transform:translateX(-50%)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.ans{list-style:none;padding:0;margin:0}.ans li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ans li b{font-weight:600}.ans li span{color:var(--red);white-space:nowrap;font-weight:700}
select{font-size:17px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;width:100%;margin-top:6px}
.gap{font-size:22px;font-weight:700;margin-top:12px;line-height:1.5}.gap .r{color:var(--red)}
canvas{width:100%;border-radius:14px;display:block;border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row>*{flex:1}
.note{color:var(--sub);font-size:12px;margin-top:18px;line-height:1.7}
</style>
</head>
<body>

<section class="screen" id="s-title">
  <div><span class="tag">10問・約1分</span></div>
  <h1 class="mincho">あなたの感覚は、<br><span class="r">何年生まれ</span>？</h1>
  <p class="lead">電話のかけ方、返事の打ち方、暑い日にまず手に取るもの。<br>ふだんの何気ない答えから、あなたの「感覚の生まれ年」を当てます。実年齢は、最後に答え合わせします。</p>
  <div class="strip"><span>昭和</span><span>平成</span><span>令和</span></div>
  <button class="cta" id="startBtn">はじめる</button>
</section>

<section class="screen" id="s-q" hidden>
  <div class="dots" id="dots"></div>
  <div id="qbox"></div>
</section>

<section class="screen" id="s-calc" hidden>
  <div class="calc"><div class="y mincho" id="calcY">1985</div><p>あなたの感覚を判定しています…</p></div>
</section>

<section class="screen" id="s-res" hidden>
  <div class="res-top">
    <div class="pre">あなたの感覚は</div>
    <div class="big mincho"><span id="resY"></span><small>年生まれ</small></div>
    <div class="wa" id="resWa"></div>
    <div class="type" id="resType"></div>
  </div>
  <p class="desc" id="resDesc"></p>
  <div class="box">
    <h3>答え合わせ：本当は何年生まれ？</h3>
    <select id="realSel"></select>
    <div class="gap" id="gap"></div>
  </div>
  <div class="box">
    <h3>答えのばらつき</h3>
    <div class="bar" id="bar"><div class="axis"></div></div>
    <div class="ticks"><span>1950</span><span>1970</span><span>1990</span><span>2010</span></div>
    <p class="note" id="spread"></p>
  </div>
  <canvas id="card" width="1200" height="630"></canvas>
  <div class="row"><button class="cta red" id="shareBtn">Xで結果を投稿</button></div>
  <div class="row"><button class="ghost" id="saveBtn">画像を保存</button><button class="ghost" id="againBtn">別の10問で</button></div>
  <div class="box">
    <h3>あなたの答え</h3>
    <ul class="ans" id="ans"></ul>
  </div>
  <p class="note">※判定は、それぞれの答えを選びがちな世代の目安から計算した遊びです。統計にもとづくものではありません。</p>
</section>

<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
